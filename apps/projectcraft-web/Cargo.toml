[package]
name = "projectcraft-web"
description = "ProjectCraft L7 WebAssembly browser application (eframe web runner)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "projectcraft-web"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
projectcraft_engine = { path = "../../crates/engine" }
projectcraft-ui-egui = { path = "../../crates/ui-egui" }
egui = "0.36"
eframe = "0.36"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
